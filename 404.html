<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quagen Studios</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This 404 page runs whenever GitHub Pages can't find a
      // real file at the requested path (e.g. /@quagen). It
      // re-encodes that path into a query string and sends the
      // browser to index.html, which decodes it back (see the
      // matching script at the top of index.html) so our own
      // client-side router can pick it up.
      var pathSegmentsToKeep = 0; // 0 because quagen.lol is a custom domain at the root
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
