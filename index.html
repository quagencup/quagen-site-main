<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quagen.lol | Coming Soon</title>
<style>
  :root{
    --black:#050505;
    --purple:#8B2FF5;
    --purple-hot:#C24CFF;
    --green:#3DFF9A;
    --green-dim:#1FBD73;
    --white:#F6F7F9;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--black);
    font-family:'Segoe UI', 'Inter', -apple-system, sans-serif;
    color:var(--white);
    overflow-x:hidden;
    scroll-behavior:smooth;
  }

  /* ---------- flowing wave background ---------- */
  #bg-canvas{
    position:fixed;
    inset:0;
    z-index:-1;
    display:block;
    width:100vw;
    height:100vh;
    background:var(--black);
  }

  /* ---------- HERO SECTION ---------- */
  .hero{
    position:relative;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--green);
    margin-bottom:28px;
    opacity:0.9;
  }
  .eyebrow::before{
    content:'◆ ';
    color:var(--purple-hot);
  }

  .headline{
    font-size:clamp(2.6rem, 8vw, 5.5rem);
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.02;
    color:var(--white);
    text-shadow: 0 0 60px rgba(194,76,255,0.35);
  }

  .subtitle{
    margin-top:22px;
    font-size:clamp(1.1rem, 2.6vw, 1.5rem);
    color:var(--green);
    font-weight:400;
    letter-spacing:0.02em;
  }
  .subtitle .label{
    font-size:0.6em;
    letter-spacing:0.2em;
    color:rgba(246,247,249,0.5);
    display:block;
    margin-top:6px;
    text-transform:uppercase;
  }

  /* ---------- Loading compass ---------- */
  .loader-wrap{
    margin-top:56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .compass{
    width:64px;
    height:64px;
    animation: spin 3.2s linear infinite;
    transform-origin:center;
    filter: drop-shadow(0 0 10px rgba(61,255,154,0.5));
  }
  @keyframes spin{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
  }
  .compass .needle{
    animation: pulse 1.6s ease-in-out infinite;
    transform-origin: 32px 32px;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.4; }
  }

  .progress-text{
    font-size:12px;
    letter-spacing:0.2em;
    color:rgba(246,247,249,0.55);
    text-transform:uppercase;
  }
  .progress-text span{
    color:var(--purple-hot);
  }

  .scroll-cue{
    position:absolute;
    bottom:52px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-size:10px;
    letter-spacing:0.3em;
    color:rgba(246,247,249,0.5);
    text-transform:uppercase;
    animation: floatY 2.2s ease-in-out infinite;
  }
  @keyframes floatY{
    0%,100%{ transform:translate(-50%,0); }
    50%{ transform:translate(-50%,8px); }
  }
  .scroll-cue svg{ width:16px; height:16px; }

  /* ---------- COMING SOON SECTION ---------- */
  .coming{
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
  }

  .coming-label{
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:rgba(246,247,249,0.5);
    margin-bottom:20px;
  }

  .coming-big{
    font-size:clamp(3rem, 12vw, 9rem);
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:0.95;
    background:linear-gradient(100deg, var(--purple-hot) 0%, var(--white) 50%, var(--green) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .coming-sub{
    margin-top:24px;
    font-size:1rem;
    color:rgba(246,247,249,0.6);
    max-width:440px;
    line-height:1.6;
  }

  .divider{
    width:64px;
    height:1px;
    background:var(--green);
    margin:32px auto 0;
    opacity:0.8;
  }
</style>
</head>
<div class="coming-soon">
    <h1>Coming Soon</h1>

    <div class="countdown">
        <div class="countdown-item">
            <span id="days">00</span>
            <small>Days</small>
        </div>

        <div class="countdown-item">
            <span id="hours">00</span>
            <small>Hours</small>
        </div>

        <div class="countdown-item">
            <span id="minutes">00</span>
            <small>Minutes</small>
        </div>

        <div class="countdown-item">
            <span id="seconds">00</span>
            <small>Seconds</small>
        </div>
    </div>
</div>
</body>
</html>
