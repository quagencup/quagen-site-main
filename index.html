<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Development — Website Overhaul</title>
<style>
  :root{
    --black:#050505;
    --purple:#8B2FF5;
    --purple-hot:#C24CFF;
    --green:#3DFF9A;
    --green-dim:#1FBD73;
    --white:#F6F7F9;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--black);
    font-family:'Segoe UI', 'Inter', -apple-system, sans-serif;
    color:var(--white);
    overflow-x:hidden;
    scroll-behavior:smooth;
  }

  /* ---------- flowing wave background ---------- */
  #bg-canvas{
    position:fixed;
    inset:0;
    z-index:-1;
    display:block;
    width:100vw;
    height:100vh;
    background:var(--black);
  }

  /* ---------- HERO SECTION ---------- */
  .hero{
    position:relative;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--green);
    margin-bottom:28px;
    opacity:0.9;
  }
  .eyebrow::before{
    content:'◆ ';
    color:var(--purple-hot);
  }

  .headline{
    font-size:clamp(2.6rem, 8vw, 5.5rem);
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.02;
    color:var(--white);
    text-shadow: 0 0 60px rgba(194,76,255,0.35);
  }

  .subtitle{
    margin-top:22px;
    font-size:clamp(1.1rem, 2.6vw, 1.5rem);
    color:var(--green);
    font-weight:400;
    letter-spacing:0.02em;
  }
  .subtitle .label{
    font-size:0.6em;
    letter-spacing:0.2em;
    color:rgba(246,247,249,0.5);
    display:block;
    margin-top:6px;
    text-transform:uppercase;
  }

  /* ---------- Loading compass ---------- */
  .loader-wrap{
    margin-top:56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .compass{
    width:64px;
    height:64px;
    animation: spin 3.2s linear infinite;
    transform-origin:center;
    filter: drop-shadow(0 0 10px rgba(61,255,154,0.5));
  }
  @keyframes spin{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
  }
  .compass .needle{
    animation: pulse 1.6s ease-in-out infinite;
    transform-origin: 32px 32px;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.4; }
  }

  .progress-text{
    font-size:12px;
    letter-spacing:0.2em;
    color:rgba(246,247,249,0.55);
    text-transform:uppercase;
  }
  .progress-text span{
    color:var(--purple-hot);
  }

  .scroll-cue{
    position:absolute;
    bottom:52px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-size:10px;
    letter-spacing:0.3em;
    color:rgba(246,247,249,0.5);
    text-transform:uppercase;
    animation: floatY 2.2s ease-in-out infinite;
  }
  @keyframes floatY{
    0%,100%{ transform:translate(-50%,0); }
    50%{ transform:translate(-50%,8px); }
  }
  .scroll-cue svg{ width:16px; height:16px; }

  /* ---------- COMING SOON SECTION ---------- */
  .coming{
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
  }

  .coming-label{
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:rgba(246,247,249,0.5);
    margin-bottom:20px;
  }

  .coming-big{
    font-size:clamp(3rem, 12vw, 9rem);
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:0.95;
    background:linear-gradient(100deg, var(--purple-hot) 0%, var(--white) 50%, var(--green) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .coming-sub{
    margin-top:24px;
    font-size:1rem;
    color:rgba(246,247,249,0.6);
    max-width:440px;
    line-height:1.6;
  }

  .divider{
    width:64px;
    height:1px;
    background:var(--green);
    margin:32px auto 0;
    opacity:0.8;
  }
</style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <!-- HERO -->
  <section class="hero">
    <div class="eyebrow">Something new is forming</div>
    <h1 class="headline">Under Development</h1>
    <p class="subtitle">
      Website Overhaul
      <span class="label">Rebuilding, piece by piece</span>
    </p>

    <div class="loader-wrap">
      <svg class="compass" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="28" stroke="#3DFF9A" stroke-width="1.5" opacity="0.5"/>
        <circle cx="32" cy="32" r="2" fill="#C24CFF"/>
        <g class="needle">
          <line x1="32" y1="32" x2="32" y2="8" stroke="#C24CFF" stroke-width="2" stroke-linecap="round"/>
          <line x1="32" y1="32" x2="32" y2="52" stroke="#3DFF9A" stroke-width="2" stroke-linecap="round"/>
        </g>
        <line x1="32" y1="6" x2="32" y2="12" stroke="#3DFF9A" stroke-width="1" opacity="0.6"/>
        <line x1="32" y1="52" x2="32" y2="58" stroke="#3DFF9A" stroke-width="1" opacity="0.6"/>
        <line x1="6" y1="32" x2="12" y2="32" stroke="#3DFF9A" stroke-width="1" opacity="0.6"/>
        <line x1="52" y1="32" x2="58" y2="32" stroke="#3DFF9A" stroke-width="1" opacity="0.6"/>
      </svg>
      <div class="progress-text">Loading <span>···</span></div>
    </div>

    <div class="scroll-cue">
      <span>Scroll</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </div>
  </section>

  <!-- COMING SOON -->
  <section class="coming">
    <div class="coming-label">Next revision</div>
    <div class="coming-big">Coming Soon</div>
    <div class="divider"></div>
    <p class="coming-sub">
      We're rebuilding section by section — check back soon to see it come together.
    </p>
  </section>

<script>
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let mouseX = W/2, mouseY = H/2;
  let targetX = mouseX, targetY = mouseY;
  let hoverStrength = 0, targetStrength = 0;

  window.addEventListener('mousemove', e=>{
    targetX = e.clientX;
    targetY = e.clientY;
    targetStrength = 1;
  });
  window.addEventListener('mouseleave', ()=>{ targetStrength = 0; });
  window.addEventListener('touchmove', e=>{
    if(e.touches[0]){
      targetX = e.touches[0].clientX;
      targetY = e.touches[0].clientY;
      targetStrength = 1;
    }
  }, {passive:true});

  const waves = [
    { color:'#8B2FF5', baseY:0.30, amp:0.10, freq:1.1, speed: 0.06, phase:0.0, alpha:0.55 },
    { color:'#3DFF9A', baseY:0.48, amp:0.12, freq:0.8, speed:-0.045, phase:1.4, alpha:0.5 },
    { color:'#C24CFF', baseY:0.62, amp:0.09, freq:1.4, speed: 0.07, phase:3.1, alpha:0.5 },
    { color:'#F6F7F9', baseY:0.40, amp:0.07, freq:1.0, speed:-0.05, phase:0.7, alpha:0.28 },
    { color:'#1FBD73', baseY:0.72, amp:0.11, freq:1.25,speed: 0.055,phase:2.2, alpha:0.55 }
  ];

  let t = 0;

  function draw(){
    t += 0.012;

    mouseX += (targetX - mouseX) * 0.06;
    mouseY += (targetY - mouseY) * 0.06;
    hoverStrength += (targetStrength - hoverStrength) * 0.05;

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'screen';

    waves.forEach((w, i)=>{
      w.phase += w.speed * 0.02;

      ctx.beginPath();
      ctx.moveTo(0, H);

      const step = Math.max(6, W / 160);
      for(let x = 0; x <= W; x += step){
        const nx = x / W;

        const dx = x - mouseX;
        const dy = (w.baseY * H) - mouseY;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // colors collide + surge near the cursor
        const collision = hoverStrength * Math.exp(-(dist*dist) / (2*220*220))
                           * (140 + 60*Math.sin(t*4 + i*1.7));

        const wave = Math.sin(nx * Math.PI * 2 * w.freq + w.phase * 6.283) * w.amp * H;

        const y = w.baseY * H + wave + collision;
        ctx.lineTo(x, y);
      }

      ctx.lineTo(W, H);
      ctx.closePath();

      ctx.globalAlpha = w.alpha + hoverStrength * 0.15;
      ctx.fillStyle = w.color;
      ctx.fill();
    });

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>
</html>
